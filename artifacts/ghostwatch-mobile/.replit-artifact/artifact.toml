kind = "mobile"
previewPath = "/ghostwatch-mobile/"
title = "Ghostwatch Mobile"
description = "A mobile companion app for Ghostwatch — the sports betting intelligence platform. Lets bettors check AI-generated picks, live game signals from Ghost Express, and pre-packaged Ghostspere betting tickets from their phone. Features risk-tier color coding, confidence indicators, and real-time alerts. Connects to the shared Ghostwatch API server."
version = "1.0.0"
id = "artifacts/ghostwatch-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/ghostwatch-mobile/" ]
localPort = 23740

[services.development]
run = "pnpm --filter @workspace/ghostwatch-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ghostwatch-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ghostwatch-mobile", "run", "serve" ]

[services.env]
PORT = "23740"
BASE_PATH = "/ghostwatch-mobile/"
