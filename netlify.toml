[build]
  # Installs pnpm, installs workspace deps from the root, then builds the frontend.
  command = "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/ghostwatch run build:netlify"
  publish = "artifacts/ghostwatch/dist/public"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# REQUIRED: set VITE_API_BASE_URL in Netlify → Site settings → Environment
# variables to your deployed Replit backend URL, e.g.:
#   https://ghostwatch-api.yourusername.replit.app
#
# The frontend bakes this value at build time so every API call and auth
# request is routed to your live backend automatically.
# ---------------------------------------------------------------------------

# SPA fallback — all routes serve index.html so client-side routing works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
