## Render Blueprint — Ghostwatch full-stack deployment
## Deploy at: https://dashboard.render.com/select-repo
## Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ghostwatch-db
    databaseName: ghostwatch
    plan: free          # upgrade to starter/standard for production
    ipAllowList: []

services:
  # ── API Server (Node.js / Express) ─────────────────────────────────────────
  - type: web
    name: ghostwatch-api
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@10 &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/api-server run build:render
    startCommand: pnpm --filter @workspace/api-server run start
    preDeployCommand: >-
      npm install -g pnpm@10 &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/db run push
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ghostwatch-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: THE_ODDS_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      # Optional email — leave blank to disable
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PORTAL_URL
        sync: false

  # ── Frontend (React / Vite static site) ────────────────────────────────────
  - type: web
    name: ghostwatch-frontend
    runtime: static
    buildCommand: >-
      npm install -g pnpm@10 &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/ghostwatch run build:render
    staticPublishPath: artifacts/ghostwatch/dist/public
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set this to your ghostwatch-api Render URL after first deploy
      # e.g. https://ghostwatch-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
