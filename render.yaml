## Render Blueprint — Ghostwatch full-stack deployment
## Deploy at: https://dashboard.render.com/select-repo
## Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ghostwatch-db
    databaseName: ghostwatch
    plan: free          # upgrade to starter/standard for production
    ipAllowList: []     # allow all connections (locked down via DATABASE_URL)

services:
  # ── API Server (Node.js / Express) ─────────────────────────────────────────
  - type: web
    name: ghostwatch-api
    runtime: node
    plan: free          # upgrade for always-on / more RAM
    buildCommand: >-
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server run build:render
    startCommand: pnpm --filter @workspace/api-server run start
    # Run DB migrations automatically before each deploy
    preDeployCommand: >-
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/db run push
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ghostwatch-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true        # Render generates a random secret on first deploy
      - key: THE_ODDS_API_KEY
        sync: false                # you enter this manually in the Render dashboard
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      # Optional email / SMTP — leave blank to disable email features
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional — override if you host the portal at a custom domain
      - key: PORTAL_URL
        sync: false

  # ── Frontend (React / Vite — served as a static site) ──────────────────────
  - type: web
    name: ghostwatch-frontend
    runtime: static
    buildCommand: >-
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/ghostwatch run build:render
    staticPublishPath: artifacts/ghostwatch/dist/public
    routes:
      # Proxy all /api/* and /auth/* traffic to the backend service
      - type: rewrite
        source: /api/*
        destination: https://ghostwatch-api.onrender.com/api/*
      - type: rewrite
        source: /auth/*
        destination: https://ghostwatch-api.onrender.com/auth/*
      # SPA fallback — serve index.html for all other routes
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your ghostwatch-api service URL after the first deploy,
      # e.g. https://ghostwatch-api.onrender.com
      # The frontend uses it to point API calls at the backend.
      - key: VITE_API_BASE_URL
        sync: false
