openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ghostwatch API — AI-powered sports betting assistant
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: openai
    description: OpenAI AI chat and image operations
  - name: ghostwatch
    description: Ghostwatch main picks dashboard
  - name: ghost-express
    description: Ghost Express live in-game AI
  - name: ghostspere
    description: Ghostspere automation butler
  - name: ghostobservation
    description: Ghostobservation social & news intel
  - name: users
    description: User management
  - name: settings
    description: User settings
  - name: portal
    description: Guest portal — public landing, subscribe, and limited picks preview

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: iss
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect after login.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
      responses:
        '302':
          description: Redirect to OIDC logout.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a message and receive a streaming response
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Ghostwatch Picks ──────────────────────────────────────────────────────
  /ghostwatch/picks:
    get:
      operationId: listPicks
      tags: [ghostwatch]
      summary: Get recommended player prop picks
      parameters:
        - name: sport
          in: query
          schema: { type: string }
        - name: riskTier
          in: query
          schema: { type: string, enum: [Safe, Balanced, Aggressive] }
        - name: minConfidence
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pick"

  /ghostwatch/picks/summary:
    get:
      operationId: getPicksSummary
      tags: [ghostwatch]
      summary: Summary counts by sport, risk tier, and confidence
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicksSummary"

  /ghostwatch/games:
    get:
      operationId: listGames
      tags: [ghostwatch]
      summary: Today's slate of games
      parameters:
        - name: sport
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of today's games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"

  /ghostwatch/top-picks:
    get:
      operationId: getTopPicks
      tags: [ghostwatch]
      summary: Top 5 highest-confidence picks across all sports
      responses:
        "200":
          description: Top picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pick"

  /ghostwatch/status:
    get:
      operationId: getGhostwatchStatus
      tags: [ghostwatch]
      summary: Picks cache refresh status and data provenance
      responses:
        "200":
          description: Cache status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicksRefreshStatus"

  /ghostwatch/refresh:
    post:
      operationId: triggerRefresh
      tags: [ghostwatch]
      summary: Trigger an immediate cache refresh from The Odds API
      responses:
        "200":
          description: Refresh started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStartedResponse"
        "400":
          description: API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Ghost Express Live In-Game ────────────────────────────────────────────
  /ghost-express/live-picks:
    get:
      operationId: listLivePicks
      tags: [ghost-express]
      summary: Live in-game recommended props
      parameters:
        - name: gameId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Live picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LivePick"

  /ghost-express/live-games:
    get:
      operationId: listLiveGames
      tags: [ghost-express]
      summary: Currently live games with scores and signals
      responses:
        "200":
          description: Live games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveGame"

  /ghost-express/signals:
    get:
      operationId: listSignals
      tags: [ghost-express]
      summary: Momentum and usage signals for a game
      parameters:
        - name: gameId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"

  # ─── Ghostspere Automation Butler ─────────────────────────────────────────
  /ghostspere/tickets:
    get:
      operationId: listTickets
      tags: [ghostspere]
      summary: Auto-built prop combo tickets from Ghostwatch/Ghost Express picks
      parameters:
        - name: riskTier
          in: query
          schema: { type: string, enum: [Safe, Balanced, Aggressive] }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /ghostspere/send-email:
    post:
      operationId: sendTicketEmail
      tags: [ghostspere]
      summary: Send selected tickets to user email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailResult"

  # ─── Ghostobservation Social & News Intel ─────────────────────────────────
  /ghostobservation/alerts:
    get:
      operationId: listAlerts
      tags: [ghostobservation]
      summary: Social and news alerts per player and team
      parameters:
        - name: playerId
          in: query
          schema: { type: string }
        - name: teamId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialAlert"

  /ghostobservation/player-scores:
    get:
      operationId: listPlayerSocialScores
      tags: [ghostobservation]
      summary: Social impact scores for all players
      responses:
        "200":
          description: Player social scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSocialScore"

  /ghostobservation/team-pulse:
    get:
      operationId: listTeamPulse
      tags: [ghostobservation]
      summary: Team chemistry and drama scores
      responses:
        "200":
          description: Team pulse
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamPulse"

  # ─── Guest Portal ──────────────────────────────────────────────────────────
  /portal/subscribe:
    post:
      operationId: portalSubscribe
      tags: [portal]
      summary: Subscribe a guest email to Ghostwatch updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalSubscribeInput"
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubscribeResult"
        "409":
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /portal/picks/preview:
    get:
      operationId: getPortalPicksPreview
      tags: [portal]
      summary: Public preview of top picks (limited, no auth required)
      responses:
        "200":
          description: Preview picks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPicksPreview"

  /portal/stats:
    get:
      operationId: getPortalStats
      tags: [portal]
      summary: Public social-proof stats (total picks today, sports covered, subscribers)
      responses:
        "200":
          description: Portal stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalStats"

  /portal/subscribers:
    get:
      operationId: getPortalSubscribers
      tags: [portal]
      summary: Operator view — subscriber counts and recent sign-ups (requires auth)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Subscriber analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubscribersResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── User Settings ─────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current user settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema: { type: string }
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema: { type: string }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: '"ok" when live data is fresh; "degraded" when stale or no API key'
        dataFreshness:
          type: string
          enum: [ok, stale, no_api_key]
          description: '"ok" fresh live data; "stale" real data overdue for refresh; "no_api_key" running in demo mode'
        isStale:
          type: boolean
          description: True when picks are older than PICKS_STALENESS_MINUTES or no API key is configured
        lastRefreshedAt:
          type: ["string", "null"]
          description: ISO 8601 timestamp of the last successful picks refresh, or null if never refreshed
        consecutiveFailures:
          type: number
          description: Number of back-to-back refresh failures; resets to 0 on success
        source:
          type: string
          enum: [live, snapshot, mock]
          description: '"live" fetched this session; "snapshot" restored from disk; "mock" no API key'

    PicksRefreshStatus:
      type: object
      required: [usingRealData]
      properties:
        usingRealData:
          type: boolean
          description: True when picks were generated from a live API, false when serving mock data
        source:
          type: string
          enum: [live, snapshot, mock]
          description: '"live" fetched this session; "snapshot" restored from disk on startup; "mock" no API key'
        lastRefreshedAt:
          type: ["string", "null"]
          description: ISO 8601 timestamp of the most recent successful refresh, or null if never refreshed
        isStale:
          type: boolean
          description: True when picks are older than the staleness threshold or the API key is not set
        consecutiveFailures:
          type: number
          description: Number of consecutive refresh failures (resets to 0 on success)
        lastError:
          type: ["string", "null"]
          description: Error message from the most recent failed refresh attempt

    RefreshStartedResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # ─── Auth ─────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ─── OpenAI ───────────────────────────────────────────────────────────────
    OpenaiConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: number }
        title: { type: string }
        createdAt: { type: string, format: date-time }
    OpenaiMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: number }
        conversationId: { type: number }
        role: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    OpenaiConversationInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
    OpenaiMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string }
    OpenaiConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id: { type: number }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
    OpenaiError:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ─── Ghostwatch ──────────────────────────────────────────────────────────
    Pick:
      type: object
      required: [id, playerName, team, opponent, propType, line, projection, confidence, riskTier, explanation, sport, createdAt]
      properties:
        id: { type: string }
        playerName: { type: string }
        team: { type: string }
        opponent: { type: string }
        sport: { type: string }
        propType: { type: string }
        line: { type: number }
        direction: { type: string, enum: [Over, Under] }
        projection: { type: number }
        confidence: { type: number }
        riskTier: { type: string, enum: [Safe, Balanced, Aggressive] }
        explanation: { type: string }
        socialImpact: { type: ["number", "null"] }
        createdAt: { type: string }

    PicksSummary:
      type: object
      required: [totalPicks, byRiskTier, bySport, avgConfidence, topSport]
      properties:
        totalPicks: { type: number }
        byRiskTier:
          type: object
          properties:
            Safe: { type: number }
            Balanced: { type: number }
            Aggressive: { type: number }
        bySport:
          type: array
          items:
            type: object
            required: [sport, count]
            properties:
              sport: { type: string }
              count: { type: number }
        avgConfidence: { type: number }
        topSport: { type: string }

    Game:
      type: object
      required: [id, homeTeam, awayTeam, sport, scheduledAt, status]
      properties:
        id: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        sport: { type: string }
        scheduledAt: { type: string }
        status: { type: string, enum: [Scheduled, Live, Final] }
        homeScore: { type: ["number", "null"] }
        awayScore: { type: ["number", "null"] }
        quarter: { type: ["string", "null"] }
        timeRemaining: { type: ["string", "null"] }

    # ─── Ghost Express ───────────────────────────────────────────────────────
    LiveGame:
      type: object
      required: [id, homeTeam, awayTeam, sport, homeScore, awayScore, quarter, timeRemaining, pace, status]
      properties:
        id: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        sport: { type: string }
        homeScore: { type: number }
        awayScore: { type: number }
        quarter: { type: string }
        timeRemaining: { type: string }
        pace: { type: string, enum: [Slow, Normal, Fast] }
        status: { type: string, enum: [Live, Halftime, Final] }

    LivePick:
      type: object
      required: [id, gameId, playerName, team, propType, line, projection, confidence, explanation, riskTier, sport]
      properties:
        id: { type: string }
        gameId: { type: string }
        playerName: { type: string }
        team: { type: string }
        propType: { type: string }
        line: { type: number }
        direction: { type: string, enum: [Over, Under] }
        projection: { type: number }
        confidence: { type: number }
        riskTier: { type: string, enum: [Safe, Balanced, Aggressive] }
        explanation: { type: string }
        sport: { type: string }
        detectedSignals: { type: array, items: { type: string } }

    Signal:
      type: object
      required: [id, gameId, type, description, strength, playerName, team]
      properties:
        id: { type: string }
        gameId: { type: string }
        type: { type: string, enum: [PaceSpike, UsageSpike, MismatchDetected, InjuryUpdate, FoulTrouble] }
        description: { type: string }
        strength: { type: string, enum: [Low, Medium, High] }
        playerName: { type: string }
        team: { type: string }

    # ─── Ghostspere ──────────────────────────────────────────────────────────
    Ticket:
      type: object
      required: [id, riskTier, picks, combinedConfidence, sport, createdAt]
      properties:
        id: { type: string }
        riskTier: { type: string, enum: [Safe, Balanced, Aggressive] }
        picks:
          type: array
          items:
            $ref: "#/components/schemas/Pick"
        combinedConfidence: { type: number }
        sport: { type: string }
        createdAt: { type: string }

    EmailRequest:
      type: object
      required: [email, ticketIds]
      properties:
        email: { type: string }
        ticketIds:
          type: array
          items: { type: string }
        sport: { type: string }

    EmailResult:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }

    # ─── Ghostobservation ────────────────────────────────────────────────────
    SocialAlert:
      type: object
      required: [id, playerId, playerName, team, alertType, description, severity, createdAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        alertType: { type: string, enum: [PartyRisk, FatigueRisk, MotivationBoost, InjuryConcern, DramaAlert, TravelFatigue] }
        description: { type: string }
        severity: { type: string, enum: [Low, Medium, High] }
        source: { type: string }
        sourceUrl: { type: string }
        createdAt: { type: string }

    PlayerSocialScore:
      type: object
      required: [playerId, playerName, team, sport, socialImpactScore, flags, updatedAt]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        sport: { type: string }
        socialImpactScore: { type: number }
        flags:
          type: array
          items: { type: string }
        updatedAt: { type: string }

    TeamPulse:
      type: object
      required: [teamId, teamName, sport, chemistryScore, dramaLevel, travelFatigue, recentAlerts]
      properties:
        teamId: { type: string }
        teamName: { type: string }
        sport: { type: string }
        chemistryScore: { type: number }
        dramaLevel: { type: string, enum: [Low, Medium, High] }
        travelFatigue: { type: string, enum: [None, Moderate, Severe] }
        recentAlerts: { type: number }
        notes: { type: ["string", "null"] }

    # ─── User Settings ────────────────────────────────────────────────────────
    UserSettings:
      type: object
      required: [id, email, preferredSports, riskProfile, picksPerTicket, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        preferredSports:
          type: array
          items: { type: string }
        riskProfile: { type: string, enum: [Safe, Balanced, Aggressive] }
        picksPerTicket: { type: number }
        emailNotifications: { type: boolean }
        createdAt: { type: string }

    UserSettingsInput:
      type: object
      properties:
        email: { type: string }
        preferredSports:
          type: array
          items: { type: string }
        riskProfile: { type: string, enum: [Safe, Balanced, Aggressive] }
        picksPerTicket: { type: number }
        emailNotifications: { type: boolean }

    # ─── Guest Portal ─────────────────────────────────────────────────────────
    PortalSubscribeInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
        name: { type: ["string", "null"] }

    PortalSubscribeResult:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }

    PortalPickPreview:
      type: object
      required: [id, playerName, sport, propType, line, direction, confidence, riskTier]
      properties:
        id: { type: string }
        playerName: { type: string }
        sport: { type: string }
        propType: { type: string }
        line: { type: number }
        direction: { type: string, enum: [Over, Under] }
        confidence: { type: number }
        riskTier: { type: string, enum: [Safe, Balanced, Aggressive] }
        isLocked: { type: boolean }

    PortalPicksPreview:
      type: object
      required: [picks, totalAvailable, lockedCount]
      properties:
        picks:
          type: array
          items:
            $ref: "#/components/schemas/PortalPickPreview"
        totalAvailable: { type: number }
        lockedCount: { type: number }

    PortalStats:
      type: object
      required: [picksToday, sportsLive, subscribers, avgConfidence]
      properties:
        picksToday: { type: number }
        sportsLive: { type: number }
        subscribers: { type: number }
        avgConfidence: { type: number }

    PortalDailyCount:
      type: object
      required: [date, count]
      properties:
        date: { type: string }
        count: { type: number }

    PortalRecentSubscriber:
      type: object
      required: [id, email, createdAt, source]
      properties:
        id: { type: number }
        email: { type: string }
        name: { type: ["string", "null"] }
        source: { type: string }
        createdAt: { type: string }

    PortalSubscribersResponse:
      type: object
      required: [total, last7Days, dailyCounts, recent]
      properties:
        total: { type: number }
        last7Days: { type: number }
        dailyCounts:
          type: array
          items:
            $ref: "#/components/schemas/PortalDailyCount"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/PortalRecentSubscriber"
